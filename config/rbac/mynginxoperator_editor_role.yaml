# permissions for end users to edit mynginxoperators.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nginxoperator
    app.kubernetes.io/managed-by: kustomize
  name: mynginxoperator-editor-role
rules:
- apiGroups:
  - operator.example.com
  resources:
  - mynginxoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operator.example.com
  resources:
  - mynginxoperators/status
  verbs:
  - get
